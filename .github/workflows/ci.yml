name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (uv workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync uv workspace
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check agents execution-sandbox packages

      - name: Tests — artisan-agents
        run: uv run --package artisan-agents pytest agents/tests

      - name: Tests — artisan-execution-sandbox
        run: uv run --package artisan-execution-sandbox pytest execution-sandbox/tests

      - name: Tests — artisan-shared
        run: uv run --package artisan-shared pytest packages/artisan_shared/tests

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
