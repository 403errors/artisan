[project]
name = "artisan-execution-sandbox"
version = "0.1.0"
description = "Gate 2's execution job: clones the repo, runs a bounded ADK coding agent against the Plan, runs the test suite, pushes a branch, and writes the ExecutionResult back to Firestore. Triggered per-attempt as a Cloud Run Job by agents/gcp/cloud_run_jobs.py."
authors = [
    { name = "Sameer Verma", email = "na21b061@smail.iitm.ac.in" }
]
requires-python = ">=3.13"
# Only directly-imported libraries are declared here; githubkit / secret-manager / pydantic come
# transitively via artisan-shared (the sandbox only touches them through that package's helpers).
dependencies = [
    "artisan-shared",
    "google-adk==2.8.0",
    "google-cloud-firestore==2.29.0",
    "google-cloud-storage==2.19.0",
    "semgrep==1.79.0",
]

[tool.uv.sources]
artisan-shared = { workspace = true }

[project.scripts]
artisan-execution-sandbox = "artisan_execution_sandbox.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
