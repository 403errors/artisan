[project]
name = "artisan-agents"
version = "0.1.0"
description = "Artisan's orchestrator: FastAPI webhook/Pub/Sub ingress, Gate 1 intake, Gate 2 plan-execute-verify-PR, Gate 3 merge-conflict triage, and the ADK reasoning agents. See docs/SYSTEM_DESIGN.md."
authors = [
    { name = "Sameer Verma", email = "na21b061@smail.iitm.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "artisan-shared",
    "fastapi==0.141.1",
    "githubkit[auth-app]==0.16.1",
    "google-adk==2.8.0",
    "google-cloud-firestore==2.29.0",
    "google-cloud-pubsub==2.39.2",
    "google-cloud-run==0.16.1",
    "google-cloud-secret-manager==2.30.0",
    "httpx==0.28.1",
    "opentelemetry-exporter-gcp-trace==1.15.0",
    "opentelemetry-sdk==1.42.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.4",
]

[tool.uv.sources]
artisan-shared = { workspace = true }
artisan-execution-sandbox = { workspace = true }

[project.scripts]
artisan-agents = "artisan_agents:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # The E2E eval harness (agents/evals/test_e2e_eval.py) runs the sandbox's coding agent
    # locally against fixture repos — a dev-only dependency; production Gate 2 still triggers
    # the sandbox as a Cloud Run Job.
    "artisan-execution-sandbox",
]

[tool.pytest.ini_options]
markers = [
    "eval: live-Gemini eval harness (agents/evals/) — excluded from default runs; run explicitly with `uv run --package artisan-agents pytest agents/evals -m eval`",
    "integration: real-Firestore tests (test_firestore_client.py, test_firestore_schema.py) — excluded from default runs; run explicitly with `-m integration`",
]
# Evals call live Gemini (non-deterministic, costs quota); integration tests write to the real
# dev Firestore (~90s of network round-trips) — neither belongs in the default test run.
# A `-m` flag on the command line overrides this (CLI args win over addopts).
addopts = "-m 'not eval and not integration'"
# The E2E eval's fixture repos contain their own test suites (they're the *subject* of the eval,
# copied and run by the harness) — never collect them as tests of this project. NOTE: overriding
# norecursedirs replaces pytest's defaults, so the defaults are restated here — without `.*` the
# bench harness's local .cache checkouts (GBs of cloned repos) get collected and crash collection.
norecursedirs = ["e2e_fixtures", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
